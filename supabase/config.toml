# Platform Pulse rankings sync
# Scheduled via pg_cron (migration 20260327000000) at 06:15 UTC daily.
# Manual: curl -X POST "https://yitejhvhkpuklapxhpqk.supabase.co/functions/v1/sync-rankings"

[functions.sync-rankings]
verify_jwt = false

# Account deletion — requires user JWT (default verify_jwt = true)
[functions.delete-account]
verify_jwt = true

# Pro remote burn-alert subscribe — requires user JWT
[functions.burn-alert-subscribe]
verify_jwt = true

# Batch burn-spike monitor — GitHub Actions cron with MONITOR_CRON_SECRET (not user JWT)
[functions.monitor-burn-spikes]
verify_jwt = false
